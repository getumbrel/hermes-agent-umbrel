services:
  # Official Hermes dashboard + messaging gateway supervised by upstream s6.
  web:
    build: .
    image: hermes-agent-umbrel:v2026.6.5
    container_name: hermes
    hostname: hermes # Shell prompt shows "hermes@hermes" instead of "hermes@<container-id>"
    restart: unless-stopped
    environment:
      APP_SEED: ${APP_SEED:-dev} # Provided by umbrelOS; fallback for local dev
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      # Enable upstream's supervised dashboard service inside the same s6 tree
      # as the gateway, so official dashboard actions like gateway restart work.
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "18789"
      # Umbrel's app proxy is the auth boundary; do not expose this raw port.
      HERMES_DASHBOARD_INSECURE: "1"
      # Chat still uses the official TUI, but this shim runs first-time setup
      # automatically before handing off to upstream's bundled TUI.
      HERMES_TUI_DIR: "/app/umbrel-tui"
      HERMES_UPSTREAM_TUI_ENTRY: "/opt/hermes/ui-tui/dist/entry.js"
      # Bring up the default gateway service on first boot of a fresh volume.
      HERMES_GATEWAY_BOOTSTRAP_STATE: "running"
    ports:
      # Expose local dev on 18790 to match the Umbrel app port; the dashboard listens on 18789.
      - "18790:18789"
    volumes:
      - ./data:/opt/data
    command: ["gateway", "run"]
